<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Welcome to GeeksforGeek!</h2>
    <br />
    <h5>Please enter your details</h5>
    <div>
      <form action="#">
        <table width="100%">
          <thead></thead>
          <tbody>
            <tr>
              <td>Full name:</td>
              <td>
                <input
                  type="text"
                  maxlength="20"
                  name="name"
                  id="1"
                  placeholder="សំបូរ​ ផល"
                />
              </td>
            </tr>
            <tr>
              <td>Set your Password:</td>
              <td>
                <input type="password" name="password" placeholder="123" />
              </td>
            </tr>
            <tr>
              <td>E-mail address:</td>
              <td>
                <input type="email" name="email" placeholder="" />
              </td>
            </tr>
            <tr>
              <td>Gender:</td>
              <td>
                <input type="radio" id="male" />
                <label for="male">Male</label>
                <input type="radio" id="female" />
                <label for="female">Female</label>
              </td>
            </tr>
            <tr>
              <td>Highest Education:</td>
              <td>
                <select name="" id="select">
                  <option value=".....">....</option>
                  <option value="nnn" selected>nnn</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Looking for a job change?:</td>
              <td>
                <input type="checkbox" name="yes" />
              </td>
            </tr>
            <tr>
              <td>Current company Name:</td>
              <td>
                <input type="text" name="hhh" list="123" />
                <datalist id="123">
                  <option value="nigga"></option>
                  <option value="femboy">femboy</option>
                </datalist>
              </td>
            </tr>
            <tr>
              <td>Job types:</td>
              <td>
                <select name="" id="">
                  <option value="permanent">permanent</option>
                  <option value="temporery">temporery</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Year of experience:</td>
              <td>
                <input type="radio" name="1-3" id="1-3" />
                <label for="1-3">1-3 year</label>
                <input type="radio" name="1-3" id="1-3" />
                <label for="1-3">1-3 year</label>
                <input type="radio" name="1-3" id="1-3" />
                <label for="1-3">1-3 year</label>
              </td>
            </tr>
            <tr>
              <td>Programming skills:</td>
              <td>
                <input type="radio" name="java" id="java" />
                <label for="java">Java</label>
                <input type="radio" name="C++" id="C++" />
                <label for="C++">C++</label>
                <input type="radio" name="java" id="java" />
                <label for="java">Java</label>
                <input type="radio" name="C++" id="C++" />
                <label for="C++">C++</label>
              </td>
            </tr>
            <tr>
              <td>Profile summary:</td>
              <td>
                <textarea
                  rows="3"
                  cols="30"
                  name=""
                  id=""
                  maxlength="50"
                  placeholder="hello"
                ></textarea>
              </td>
            </tr>
            <tr>
              <td>
                <button type="submit">
                  <img
                    width="70px"
                    src="https://i.pinimg.com/736x/4f/e4/7b/4fe47b28fe29bacddecd4244d7a00a96.jpg"
                    alt=""
                  />
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </div>
    <div><a href="nigga.html">click here</a></div>
  </body>
</html>
